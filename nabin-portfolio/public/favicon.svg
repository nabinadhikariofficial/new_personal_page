<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Light Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#EFF6FF"/>

  <!-- Neural Network Connections -->
  <g stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lines -->
    <line x1="20" y1="28" x2="32" y2="22"/>
    <line x1="32" y1="22" x2="44" y2="28"/>
    <line x1="20" y1="36" x2="32" y2="42"/>
    <line x1="32" y1="42" x2="44" y2="36"/>
    <line x1="24" y1="32" x2="32" y2="32"/>
    <line x1="32" y1="32" x2="40" y2="32"/>
  </g>

  <!-- Neural Nodes -->
  <g fill="#6366F1">
    <circle cx="20" cy="28" r="2.5"/>
    <circle cx="44" cy="28" r="2.5"/>
    <circle cx="20" cy="36" r="2.5"/>
    <circle cx="44" cy="36" r="2.5"/>
    <circle cx="32" cy="22" r="2.5"/>
    <circle cx="32" cy="32" r="3"/>
    <circle cx="32" cy="42" r="2.5"/>
  </g>

  <!-- Subtle Pulse Animation for Nodes -->
  <g>
    <circle cx="32" cy="32" r="3" fill="#6366F1">
      <animate attributeName="r" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
